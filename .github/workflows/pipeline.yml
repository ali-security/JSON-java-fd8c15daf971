# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest filter (empty runs the full suite)'
        required: false
        default: ''

jobs:
  # old-school build and jar method. No tests run or compiled.
  build-1_6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # build for java 1.6, however don't run any tests
        java: [ 1.6 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v2
      - name: Download Zulu JDK 6
        run: curl -fsSL https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz -o "$RUNNER_TEMP/jdk.tar.gz"
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
      - name: Compile Java ${{ matrix.java }}
        run: |
          mkdir -p target/classes
          javac -d target/classes/ src/main/java/org/json/*.java
      - name: Create java ${{ matrix.java }} JAR
        run: |
          jar cvf target/org.json.jar -C target/classes .
      - name: Upload Java ${{ matrix.java }} JAR
        uses: actions/upload-artifact@v4
        with:
          name: Java ${{ matrix.java }} JAR
          path: target/org.json.jar

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAVEN_OPTS: -Xss4m
    strategy:
      fail-fast: false
      matrix:
        # build against supported Java LTS versions:
        java: [ 1.7, 8, 11 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v2
      - name: Download Zulu JDK 7
        if: matrix.java == '1.7'
        run: |
          curl -fsSL https://cdn.azul.com/zulu/bin/zulu7.56.0.11-ca-jdk7.0.352-linux_x64.tar.gz -o "$RUNNER_TEMP/jdk7.tar.gz"
          echo "JDK_FILE=$RUNNER_TEMP/jdk7.tar.gz" >> "$GITHUB_ENV"
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
          jdkFile: ${{ env.JDK_FILE }}
      - name: Java 7 compatible Maven and lifecycle plugins
        if: matrix.java == '1.7'
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.8.8/apache-maven-3.8.8-bin.tar.gz -o /tmp/maven.tar.gz
          tar -xzf /tmp/maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.8.8/bin" >> "$GITHUB_PATH"
          sed -i '0,/<build>/s||<build><pluginManagement><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-clean-plugin</artifactId><version>3.1.0</version></plugin><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-resources-plugin</artifactId><version>3.2.0</version></plugin><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-surefire-plugin</artifactId><version>2.22.2</version></plugin></plugins></pluginManagement>|' pom.xml
      - name: Compile Java ${{ matrix.java }}
        run: mvn clean compile -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} -Dmaven.test.skip=true -Dmaven.site.skip=true -Dmaven.javadoc.skip=true
      - name: Run Tests ${{ matrix.java }}
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn test -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} -DargLine=-Xss512k -Dtest="${{ inputs.test-filter }}" -DfailIfNoTests=false
          else
            mvn test -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} -DargLine=-Xss512k
          fi
      - name: Build Test Report ${{ matrix.java }}
        if: ${{ always() }}
        run: |
          mvn org.apache.maven.plugins:maven-surefire-report-plugin:2.22.2:report-only -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
          mvn site -DgenerateReports=false -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
      - name: Upload Test Results ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Results ${{ matrix.java }}
          path: target/surefire-reports/
      - name: Upload Test Report ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Report ${{ matrix.java }}
          path: target/site/
      - name: Package release jar
        if: matrix.java == '8'
        run: mvn package -Dmaven.test.skip=true -Dmaven.javadoc.skip=true
      - name: Upload release jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: json-release-jar
          path: target/json-*[0-9].jar
          if-no-files-found: error
